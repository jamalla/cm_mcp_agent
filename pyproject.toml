[project]
name = "cm-mcp-agent"
version = "0.1.0"
description = "Routing agent and showcase UI: prompt -> contract choice -> MCP call -> live pipeline trace"
requires-python = ">=3.11"
dependencies = [
    # MCP client only. This service never runs an engine.
    "fastmcp>=2.11",
    "langgraph>=0.2.60",
    "openai>=1.50",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
cm-bff = "cm_agent.bff.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cm_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
log_level = "WARNING"

[tool.ruff]
line-length = 100
extend-exclude = [".venv", "node_modules", "frontend", "dist"]

[tool.ruff.lint]
# F: unused imports and names. ERA: commented-out code. B/SIM/RET/C4/UP: the
# small stuff that accumulates. Deliberately not the whole catalogue -- a lint
# nobody can keep green stops being read.
select = ["F", "E", "W", "I", "B", "SIM", "RET", "C4", "UP", "ERA", "ARG"]
ignore = ["E501"]  # line length is reported by the formatter, not worth failing on

[tool.ruff.lint.per-file-ignores]
# A pytest fixture is "used" by being requested, which ARG cannot see.
"tests/**" = ["ARG001", "ARG002"]
