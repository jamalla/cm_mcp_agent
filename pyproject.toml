[project]
name = "cm-mcp-agent"
version = "0.1.0"
description = "Routing agent and showcase UI: prompt -> contract choice -> MCP call -> live pipeline trace"
requires-python = ">=3.11"
dependencies = [
    # MCP client only. This service never runs an engine.
    "fastmcp>=2.11",
    "langgraph>=0.2.60",
    "openai>=1.50",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
cm-bff = "cm_agent.bff.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cm_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
log_level = "WARNING"
