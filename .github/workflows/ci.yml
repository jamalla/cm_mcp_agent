name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Lint
        # Unused code, commented-out code, and the small decay that accumulates.
        # Cheap to keep green now; expensive to reintroduce later.
        run: uvx ruff check .

      - name: Tests
        # Runs against tests/stub_engine.py, so this repo builds and tests with
        # no cm_mcp_engine anywhere in sight.
        run: uv run --extra dev pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Build
        run: npx vite build
